<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #fff; font-family: "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; overflow: hidden; }
  #score { font-size: 26px; font-weight: 800; letter-spacing: 2px; display: flex; gap: 18px; align-items: baseline; }
  #score .blue { color: #4d8dff; }
  #score .red { color: #ff5a5a; }
  #score .sep { color: #8b949e; }
  canvas { width: min(96vw, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 6px; box-shadow: 0 0 30px #0008; }
  #modeBar { font-size: 15px; color: #c9d1d9; }
  #modeBar select { background: #21262d; color: #fff; border: 1px solid #4d8dff; border-radius: 5px; padding: 4px 10px; font: inherit; }
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          background: radial-gradient(ellipse at center, rgba(30,45,75,0.93), rgba(8,11,17,0.97)); text-align: center; padding: 16px; box-sizing: border-box; overflow: auto; }
  #menu.hidden { display: none; }
  #logo { display: flex; flex-direction: column; align-items: center; gap: 0; transform: rotate(-2deg); }
  #logo .l1 { font: 900 clamp(46px, 9vw, 104px)/1 "Segoe UI Black", "Segoe UI", Arial, sans-serif; letter-spacing: 2px; color: #ffd23f; -webkit-text-stroke: 4px #1b2433; paint-order: stroke fill;
              text-shadow: 0 6px 0 #c2410c, 0 12px 24px #000a; }
  #logo .l2 { font: 900 clamp(28px, 5.4vw, 64px)/1 "Segoe UI Black", "Segoe UI", Arial, sans-serif; letter-spacing: 6px; color: #fff; -webkit-text-stroke: 3px #1b2433; paint-order: stroke fill; text-shadow: 0 5px 0 #2563eb, 0 10px 20px #000a; }
  #logo svg { width: clamp(220px, 34vw, 400px); height: auto; margin-top: 6px; }
  #menuMsg { font-size: clamp(22px, 3.4vw, 40px); font-weight: 800; color: #fff; min-height: 1.2em; }
  #menuMsg small { display: block; font-size: 0.5em; font-weight: 600; color: #8b949e; }
  #menuBtns { display: grid; grid-template-columns: repeat(2, minmax(200px, 300px)); gap: 16px; }
  #menuBtns button { font: 800 clamp(18px, 2.4vw, 28px) "Segoe UI", Arial, sans-serif; color: #fff; border: 3px solid #fff3; border-radius: 16px; padding: 22px 18px; cursor: pointer;
                     box-shadow: 0 6px 0 #0007, 0 10px 24px #0007; transition: transform 0.08s, filter 0.08s; }
  #menuBtns button small { display: block; margin-top: 6px; font-size: 0.55em; font-weight: 600; opacity: 0.85; }
  #menuBtns button:hover { transform: translateY(-3px) scale(1.03); filter: brightness(1.15); }
  #menuBtns button:active { transform: translateY(2px); }
  #menuBtns .two { background: linear-gradient(135deg, #2563eb, #dc2626); }
  #menuBtns .easy { background: #16a34a; }
  #menuBtns .medium { background: #d97706; }
  #menuBtns .hard { background: #b91c1c; }
  @media (max-height: 720px) { #menu { gap: 10px; } #logo svg { width: 190px; } #logo .l1 { font-size: 48px; } #logo .l2 { font-size: 28px; } #menuBtns { gap: 10px; } #menuBtns button { padding: 12px 14px; font-size: 18px; } #menuMsg { font-size: 22px; } }
  #menuHint { color: #8b949e; font-size: 14px; }
  #help { font-size: 12px; color: #8b949e; }
  #help b { color: #fff; }
  #tune { display: flex; flex-wrap: wrap; gap: 3px 16px; justify-content: center; align-items: center; font-size: 12px; color: #c9d1d9;
          background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 4px 12px; max-width: 96vw; box-sizing: border-box; }
  #tune .title { font-weight: 700; color: #fff; }
  #tune label { display: flex; align-items: center; gap: 8px; }
  #tune input[type=range] { width: 120px; accent-color: #4d8dff; }
  #tune output { display: inline-block; min-width: 3.4em; font-variant-numeric: tabular-nums; color: #fff; }
  #tune select, #tune button { background: #21262d; color: #fff; border: 1px solid #30363d; border-radius: 5px; padding: 3px 8px; font: inherit; }
</style>
</head>
<body>
  <div id="score"><span class="blue">Blue <span id="sBlue">0</span></span><span class="sep">-</span><span class="red"><span id="sRed">0</span> <span id="redName">Red</span></span></div>
  <div id="menu">
    <div id="logo">
      <span class="l1">ISAAC'S</span><span class="l2">CAR GAME</span>
      <svg viewBox="0 0 400 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(20 10)">
          <path d="M10 70 L10 52 Q10 44 20 42 L70 38 L98 12 Q104 6 114 6 L160 6 Q170 6 176 14 L196 40 L236 44 Q250 46 250 58 L250 70 Z" fill="#3b82f6" stroke="#1b2433" stroke-width="5" stroke-linejoin="round"/>
          <path d="M104 18 L152 18 L176 40 L84 40 Z" fill="#bfe3ff" stroke="#1b2433" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="132" cy="22" r="11" fill="#ffd9b0" stroke="#1b2433" stroke-width="3"/>
          <circle cx="60" cy="82" r="30" fill="#222" stroke="#1b2433" stroke-width="5"/><circle cx="60" cy="82" r="12" fill="#cbd5e1"/>
          <circle cx="204" cy="82" r="30" fill="#222" stroke="#1b2433" stroke-width="5"/><circle cx="204" cy="82" r="12" fill="#cbd5e1"/>
        </g>
        <g transform="translate(300 30) scale(0.55)"><path d="M10 70 L10 52 Q10 44 20 42 L70 38 L98 12 Q104 6 114 6 L160 6 Q170 6 176 14 L196 40 L236 44 Q250 46 250 58 L250 70 Z" fill="#ef4444" stroke="#1b2433" stroke-width="7" stroke-linejoin="round" transform="translate(250 0) scale(-1 1)"/>
          <circle cx="60" cy="82" r="30" fill="#222" stroke="#1b2433" stroke-width="7"/><circle cx="204" cy="82" r="30" fill="#222" stroke="#1b2433" stroke-width="7"/></g>
      </svg>
    </div>
    <div id="menuMsg"></div>
    <div id="menuBtns">
      <button type="button" class="two" data-mode="two">Two Players<small>one keyboard</small></button>
      <button type="button" class="easy" data-mode="ai-easy">Play the Computer<small>easy</small></button>
      <button type="button" class="medium" data-mode="ai-medium">Play the Computer<small>medium</small></button>
      <button type="button" class="hard" data-mode="ai-hard">Play the Computer<small>hard</small></button>
    </div>
    <div id="menuHint">First to 5 points wins</div>
  </div>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="help"><span style="color:#4d8dff">Blue</span>: <b>Z</b> anti-clockwise, <b>X</b> clockwise &nbsp;|&nbsp; <span id="helpRed"><span style="color:#ff5a5a">Red</span>: <b>,</b> anti-clockwise, <b>.</b> clockwise</span></div>
  <div id="tune">
    <span class="title">Tune-up</span>
    <label title="Top wheel spin speed">Top speed <input type="range" id="tMaxSpin" min="0.2" max="1.6" step="0.01"><output id="oMaxSpin"></output></label>
    <label title="Axle springiness. 1 = rigid axles; lower = softer, the car squashes on landing">Suspension <input type="range" id="tSusp" min="0" max="1" step="0.01"><output id="oSusp"></output></label>
    <label>Volume <input type="range" id="tVolume" min="0" max="1" step="0.01"><output id="oVolume"></output></label>
    <button id="tMute" type="button" title="Mute or unmute (M)">Sound on</button>
    <button id="tReset" type="button">Reset</button>
    <label>Level <span id="levelName">-</span></label>
    <label>Next <select id="nextLevel"><option value="">Random</option></select></label>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];

const W = 1280, H = 720;
const WATER_Y = H - 50;
const HEAD_R = 10, WHEEL_R = 22, WHEEL_Y = 20;   // wheel radius, and how far the axles sit below the car's design centre
const STEP = 1000 / 120;          // fixed physics step (ms)
const TUNE = { torque: 0.66, maxSpin: 0.9, accel: 2.4, brake: 0, air: -2, suspension: 0.2, airTorque: 0.525, airMaxSpin: 0.075, airDelay: 80, gravity: 0.00095, tireBounce: 0.39, bounceMinSpeed: 6 };   // wheel drive torque (with equal and opposite reaction on the chassis) and top wheel spin
const SUDDEN = { afterMs: 35000, waterRise: 14, waterMin: 60, wallSpeed: 16, wallMax: 440 };   // sudden death: after this long, the water rises or the walls close in
const END = { afterMs: 1500, fadeMs: 1500 };                                                  // end of round: a live aftermath, then the colour fade
// The Suspension slider runs 0 (very soft) to 1 (rigid). Matter solves each axle several times per step, so only a very
// low constraint stiffness gives visible give: slider 0 -> 0.004, 0.37 -> about 0.03, 1 -> 1.
const suspStiffness = s => 0.004 * Math.pow(250, s);
// Special rounds, one every 3 to 5 rounds: the wheel pickups from before, plus moon gravity, a gale and a slippery storm.
const ROUND_MODS = [
  { id: 'monster', name: 'MONSTER TRUCK WHEELS!', wheelScale: 1.45 },
  { id: 'tiny', name: 'TINY WHEELS!', wheelScale: 0.65 },
  { id: 'moon', name: 'MOON GRAVITY!', gravityMul: 0.4 },
  { id: 'wind', name: 'GALE FORCE WIND' },
  { id: 'storm', name: 'SLIPPERY STORM!' },
  { id: 'bighead', name: 'GIANT HEADS!', headScale: 3 },
  { id: 'caravan', name: 'TOWING CARAVANS!' },
  { id: 'teensy', name: 'TEENSY CARS!', carScale: 0.5 },
  { id: 'bomb', name: 'BOMB TRAILERS!' },
  { id: 'square', name: 'SQUARE WHEELS!' },
  { id: 'giant', name: 'GIANT CARS!', carScale: 2 },
  { id: 'three', name: 'BENDY THREE-WHEELERS!' },
  { id: 'mirror', name: 'MIRROR MADNESS! CONTROLS REVERSED' },
  { id: 'drunk', name: 'DIZZY DRIVERS! CONTROLS KEEP FLIPPING' },
  { id: 'meteor', name: 'METEOR SHOWER!' },
  { id: 'bouncy', name: 'BOUNCY CASTLE!', gravityMul: 0.6, bounce: 1.15 },
  { id: 'rocket', name: 'ROCKET FUEL!' },
  { id: 'beach', name: 'BEACH BALL BONANZA!' },
  { id: 'stilts', name: 'GIGANTIC WHEELS ON TALL SUSPENSION!', wheelScale: 2.2 },
  { id: 'wings', name: 'WINGS! HOLD A KEY IN THE AIR TO FLAP' },
  { id: 'bird', name: 'ANGRY BIRD ON THE LOOSE!' },
  { id: 'hammer', name: 'HAMMER TIME!  Blue: C   Red: /' }
];
const WIND_ACCEL = 0.0005;        // gale strength (px per ms squared; gravity is about 0.00135)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const CARS = {
  blue: { name: 'Blue', color: '#2f7bff', dark: '#1b4fb5', acw: 'KeyZ',   cw: 'KeyX',   hammer: 'KeyC',   group: -1, dir: 1 },
  red:  { name: 'Red',  color: '#ff3b3b', dark: '#b01f1f', acw: 'Comma', cw: 'Period', hammer: 'Slash', group: -2, dir: -1 }
};
const REASONS = {
  water: n => `${n}'s head touched the water`,
  head:  n => `${n} bumped their head`,
  bomb:  n => `${n} was blown up`,
  out:   n => `${n} left the arena`
};

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8, constraintIterations: 12 });
engine.gravity.scale = TUNE.gravity;   // Matter's default is 0.001
const keys = new Set();
const scores = { blue: 0, red: 0 };

// ---- game state
let clock = performance.now();                       // the game clock: the timestamp of the frame being processed
let cars = {};
let state = 'ready', readyUntil = 0, roundStart = 0, banner = { title: '', sub: '', tag: '' };
const losers = new Map();
let particles = [], marks = [];
let waterY = WATER_Y;                                // the water surface; sudden death can raise it
let sd = null;                                       // sudden death: { kind, start, inset, bodies, bannerUntil }
let roundNo = 0, nextPickupRound = randInt(3, 5), roundMod = null, wind = null;
let drunk = null, meteorNext = 0, bird = null;                    // dizzy drivers: { flipped, next }; meteor shower: when the next rock falls
let shake = 0;                                       // screen shake amplitude in pixels
let timeScale = 1, slow = null;                      // slow motion: { start, ms }
let overAt = 0, overInfo = null, pendingWinner = null;   // end-of-round sequence
let celebrate = null, fadeIn = null;                 // fade to the winner's colour / fade back at the next round
let touchInfo = { touching: new Set(), wheelGround: new Map(), crumbleHits: new Set() };
let testMode = false;                                // lets tests drive frames by hand
let spawnEndX = 62, spawnWheelX = [44, -44];          // the car's half-length and wheel positions this round (a three-wheeler is longer)
let spawnK = 1;                                      // how big the cars are this round (1 = normal, 2 = giant, 0.5 = teensy)
let trailerLen = 0;                                  // how far behind the car a trailer reaches this round (0 = none)
let forceModId = null;                               // force a particular special round (for testing)
let rebuilds = 0;                                    // rounds rebuilt because a car would have started inside the ground (for tests)
let lastImpact = 0;                                  // fastest wheel landing since the last reset (for tuning and tests)

/* ---------- sound: everything is synthesised with the Web Audio API, so there are no sound files ---------- */
const sfx = (() => {
  let ac = null, master = null, muffler = null, noiseBuf = null, muted = false, volume = 0.6;
  const engineNodes = {}, loops = {};
  try { const sv = JSON.parse(localStorage.getItem('carGameSound') || '{}'); if (typeof sv.volume === 'number') volume = sv.volume; if (sv.muted) muted = true; } catch (e) { }
  const pan = x => Math.max(-0.8, Math.min(0.8, (x - W / 2) / (W / 2)));       // sounds come from where they happen on screen
  function ensure() {                                                          // browsers only allow audio after a key press or click
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      muffler = ac.createBiquadFilter(); muffler.type = 'lowpass'; muffler.frequency.value = 20000;
      master = ac.createGain(); master.gain.value = muted ? 0 : volume;
      master.connect(muffler); muffler.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }
  const out = (node, p) => { if (p && ac.createStereoPanner) { const sp = ac.createStereoPanner(); sp.pan.value = p; node.connect(sp); sp.connect(master); } else node.connect(master); };
  function tone(freq, dur, { type = 'sine', gain = 0.2, to = null, delay = 0, at = null } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); out(g, at === null ? 0 : pan(at)); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, { gain = 0.2, from = 2000, to = null, type = 'lowpass', q = 0.7, delay = 0, at = null } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(from, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(Math.max(0.0002, gain), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); out(g, at === null ? 0 : pan(at)); src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }
  function loop(name, type, freq, q) {                                         // a looping noise bed (wind, rain) whose volume we steer
    if (loops[name]) return loops[name];
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    return loops[name] = g;
  }
  return {
    ensure, get ready() { return !!ac; }, get ctx() { return ac; }, get muted() { return muted; }, get volume() { return volume; },
    setVolume(v) { volume = v; if (master) master.gain.setTargetAtTime(muted ? 0 : v, ac.currentTime, 0.02); this.save(); },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : volume, ac.currentTime, 0.02); this.save(); },
    save() { try { localStorage.setItem('carGameSound', JSON.stringify({ volume, muted })); } catch (e) { } },
    // ---- one-shot effects
    landing(impact, x) {                                                       // a thud that grows with the impact
      if (impact < 3) return;
      const k = Math.min(1, impact / 14);
      noise(0.1 + k * 0.2, { gain: 0.05 + k * 0.35, from: 900, to: 150, at: x });
      tone(95, 0.12 + k * 0.15, { to: 38, gain: 0.08 + k * 0.4, at: x });
    },
    bump(x) {                                                                  // a head bump: crunch, thud and zaps
      noise(0.28, { gain: 0.5, from: 1800, to: 200, type: 'bandpass', at: x });
      tone(170, 0.35, { type: 'sawtooth', to: 55, gain: 0.3, at: x });
      for (let i = 0; i < 4; i++) tone(2200 - i * 300, 0.12, { type: 'square', to: 300, gain: 0.06, delay: 0.03 + i * 0.06, at: x });
    },
    splash(x) { noise(0.55, { gain: 0.4, from: 3500, to: 300, at: x }); noise(0.2, { gain: 0.25, from: 6000, type: 'highpass', at: x }); },
    chime(kind, x) {
      if (kind === 'boost') { noise(0.4, { gain: 0.18, from: 400, to: 5000, type: 'bandpass', at: x }); tone(440, 0.3, { type: 'sawtooth', to: 1320, gain: 0.12, at: x }); }
      else { tone(880, 0.35, { gain: 0.18, at: x }); tone(1320, 0.45, { gain: 0.14, delay: 0.09, at: x }); tone(1760, 0.5, { gain: 0.1, delay: 0.18, at: x }); }
    },
    pop(x) { tone(700, 0.12, { type: 'triangle', to: 180, gain: 0.3, at: x }); noise(0.1, { gain: 0.25, from: 4000, type: 'highpass', at: x }); },
    snap(x) { noise(0.09, { gain: 0.6, from: 2500, type: 'highpass', at: x }); tone(130, 0.18, { type: 'square', to: 55, gain: 0.25, at: x }); },
    fuse(x) { noise(0.4, { gain: 0.1, from: 3500, type: 'highpass', at: x }); },
    tick(left, x) { tone(left <= 1 ? 1400 : 1000, 0.07, { type: 'square', gain: 0.15, at: x }); if (left <= 1) tone(1400, 0.07, { type: 'square', gain: 0.15, delay: 0.25, at: x }); },
    boom(x) {
      noise(1.1, { gain: 0.85, from: 1800, to: 60, at: x });
      tone(95, 0.9, { to: 28, gain: 0.7, at: x });
      noise(0.3, { gain: 0.4, from: 6000, to: 800, type: 'highpass', at: x });
    },
    go() { tone(660, 0.1, { type: 'square', gain: 0.1 }); tone(990, 0.22, { type: 'square', gain: 0.1, delay: 0.12 }); },
    special() { [330, 440, 554, 660].forEach((f, i) => tone(f, 0.14, { type: 'square', gain: 0.09, delay: i * 0.09 })); },
    wah() { tone(330, 0.25, { type: 'triangle', to: 200, gain: 0.2 }); tone(250, 0.45, { type: 'triangle', to: 120, gain: 0.2, delay: 0.22 }); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.2, { type: 'triangle', gain: 0.16, delay: i * 0.11 })); },
    siren() { for (let i = 0; i < 6; i++) tone(i % 2 ? 560 : 780, 0.2, { type: 'square', gain: 0.1, delay: i * 0.22 }); },
    rumble(x) { noise(0.8, { gain: 0.35, from: 260, to: 120, at: x }); },
    crash(x) { noise(0.5, { gain: 0.5, from: 1200, to: 150, at: x }); tone(70, 0.4, { to: 35, gain: 0.35, at: x }); },
    // ---- continuous sounds, steered every frame
    engines(cars, state) {                                                     // each car has its own engine note, panned to its side
      if (!ac) return;
      const now = ac.currentTime;
      for (const id in cars) {
        const c = cars[id];
        if (!engineNodes[id]) {
          const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
          o1.type = 'sawtooth'; o2.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = 500; g.gain.value = 0;
          o1.connect(lp); o2.connect(lp); lp.connect(g); out(g, id === 'blue' ? -0.5 : 0.5); o1.start(); o2.start();
          engineNodes[id] = { o1, o2, lp, g };
        }
        const e = engineNodes[id], thr = c.throttle || 0;
        const spin = Math.min(1, (Math.abs(c.wheels[0].angularVelocity) + Math.abs(c.wheels[1].angularVelocity)) / 1.6);
        const f = (48 + 130 * spin + 45 * thr) / Math.pow(c.carScale, 0.6) / Math.pow(Math.max(0.6, c.wheelR / 19.4), 0.3);   // teensy cars buzz, monsters rumble
        e.o1.frequency.setTargetAtTime(f, now, 0.06); e.o2.frequency.setTargetAtTime(f * 0.5, now, 0.06);
        e.lp.frequency.setTargetAtTime(350 + 900 * thr + 400 * spin, now, 0.08);
        e.g.gain.setTargetAtTime(state === 'playing' || state === 'over' ? 0.02 + 0.05 * thr + 0.03 * spin : 0, now, 0.1);
      }
    },
    ambient(kind, clockNow) {                                                  // wind in a gale, rain in a storm
      if (!ac) return;
      const now = ac.currentTime;
      loop('wind', 'bandpass', 520, 0.5).gain.setTargetAtTime(kind === 'wind' ? 0.11 * (0.7 + 0.3 * Math.sin(clockNow / 1100)) : 0, now, 0.3);
      loop('rain', 'highpass', 3800, 0.4).gain.setTargetAtTime(kind === 'storm' ? 0.08 : 0, now, 0.3);
    },
    muffle(timeScale) {                                                        // slow motion muffles everything, like being underwater
      if (!ac) return;
      muffler.frequency.setTargetAtTime(Math.max(450, 18000 * timeScale * timeScale * timeScale), ac.currentTime, 0.05);
    }
  };
})();

/* ---------- particles ---------- */

    const xLo = left ? Math.max(180, l / 2 + 40) : 830, xHi = left ? 450 : Math.min(1100, W - l / 2 - 40);
    if (xHi < xLo) continue;
    const c = { x: rand(xLo, xHi), y: rand(y[0], y[1]) };
    if (slabPts(c.x, c.y, l, ang).some(q => q.x < 30 || q.x > W - 30) || !clearOf(slabPts(c.x, c.y, l, ang), 90)) continue;
    const lo = -l / 2 + (trailerLen && left ? 200 : (spawnEndX + 8) * spawnK), hi = l / 2 - (trailerLen && !left ? 200 : (spawnEndX + 8) * spawnK);      // with a trailer, leave room behind the car

    const s = addSlab(c.x, c.y, l, ang);

// Loose, bouncy things the cars can shove about: ball-pit balls, huge beach balls and falling rocks.
const BALL_COLOURS = ['#ff4d6d', '#ffd23f', '#3fb6ff', '#7bd957', '#ff9f1a', '#c77dff'];
function addBall(x, y, r, kind = 'ball', o = {}) {
  const body = Bodies.circle(x, y, r, { friction: 0.05, frictionStatic: 0.05, restitution: kind === 'rock' ? 0.2 : 0.85, density: kind === 'rock' ? 0.004 : kind === 'beach' ? 0.0004 : 0.0007, frictionAir: kind === 'rock' ? 0 : 0.002, label: 'prop' });
  body.propKind = kind;
  Composite.add(engine.world, body);
  const p = { type: 'ball', kind, body, r, color: pick(BALL_COLOURS), born: clock, life: o.life || 0, gone: false };
  L.props.push(p); L.items.push(p);
  return p;
}
function addBalls(n, rLo, rHi, yLo, yHi) {
  for (let i = 0; i < 300 && n > 0; i++) {
    const r = rand(rLo, rHi), x = rand(120, W - 120), y = rand(yLo, yHi);
    if (L.samples.some(q => Math.hypot(x - q.x, y - q.y) < r + 40)) continue;
    if (L.props.some(q => Math.hypot(x - q.body.position.x, y - q.body.position.y) < r + q.r + 6)) continue;
    addBall(x, y, r); n--;

}
// A seesaw: a heavy plank on a pivot that tips under the cars, held within a tilt limit.
function addSeesaw(cx, cy, len, maxTilt = 0.3) {
  const th = 20, body = Bodies.rectangle(cx, cy, len, th, { ...TERRAIN_PROPS, density: 0.004 });
  Composite.add(engine.world, [body, Constraint.create({ pointA: { x: cx, y: cy }, bodyB: body, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0 })]);
  L.samples.push(...slabPts(cx, cy, len, 0), ...slabPts(cx, cy + 40, len * 0.8, 0));
  const it = { type: 'seesaw', body, len, th, cx, cy, max: maxTilt };
  L.items.push(it); L.seesaws.push(it);
}
const addIsland = () => addBlob({ x: CX + rand(-90, 90), y: CY + rand(-60, 50) }, rand(110, 170), rand(35, 60), { pw: 0.7, noise: [0.02, 0.1] });

// A floor across the bottom so a fall is not the end: flat, rolling hills, or flat with water pits to drive out of.
function addFloor(forceKind) {
  const kind = forceKind || pick(['flat', 'hills', 'pits']);
  const base = rand(615, 645);
  const hs = [3, 4, 5].sort(() => Math.random() - 0.5).slice(0, 2).map(k => ({ k, a: rand(12, 25), p: rand(0, 6.28) }));
  const pits = [];
  if (kind === 'pits') {
    for (let i = randInt(1, 2); i > 0; i--) {
      const c = rand(250, 1030), w = rand(180, 260);
      if (pits.every(q => Math.abs(q.c - c) > 320)) pits.push({ c, w, y: rand(690, H - 8) });
    }
  }
  const pts = [];
  for (let x = 0; x <= W; x += 16) {
    let y = base + rand(-1, 1) * 2;
    if (kind === 'hills') y += hs.reduce((n, h) => n + h.a * Math.sin(h.k * 2 * Math.PI * x / W + h.p), 0);
    for (const q of pits) if (Math.abs(x - q.c) < q.w / 2) y += (q.y - base) * 0.5 * (1 + Math.cos(Math.PI * (x - q.c) / (q.w / 2)));

}
// Solid side walls so cars cannot drive or fly off the sides.
function addWalls() {
  for (const x of [-20, W + 20]) Composite.add(engine.world, Bodies.rectangle(x, H / 2, 64, H * 3, { ...TERRAIN_PROPS, isStatic: true }));

  L.extras.push('side walls');
}

/* ---------- surface patches: ice and mud ---------- */
const PATCH = {
  ice: { friction: 0.004, frictionStatic: 0.004, label: 'ice patch' },
  mud: { friction: 3, frictionStatic: 10, label: 'sticky mud' }
};
// A raised strip (7 px high, tapered ends) lying on a straight stretch of ground.
function addPatch(a, b, kind) {
  const T = 7, inset = 8, len = Math.hypot(b.x - a.x, b.y - a.y);
  const d = { x: (b.x - a.x) / len, y: (b.y - a.y) / len }, u = { x: d.y, y: -d.x };
  const roof = len - 2 * inset, hc = (T / 3) * (len + 2 * roof) / (len + roof);     // height of the trapezoid's centre of mass
  const mid = { x: (a.x + b.x) / 2 + u.x * hc, y: (a.y + b.y) / 2 + u.y * hc };
  const p = PATCH[kind];
  const body = Bodies.trapezoid(mid.x, mid.y, len, T, 2 * inset / len,
    { isStatic: true, angle: Math.atan2(d.y, d.x), friction: p.friction, frictionStatic: p.frictionStatic, label: 'terrain' });
  body.surface = kind;
  body.friction = p.friction;                      // Matter resets a static body's friction to 1, so set it after creation
  Composite.add(engine.world, body);
  L.items.push({ type: 'patch', kind, a, b, d, u, T, inset });
  if (!L.extras.includes(p.label)) L.extras.push(p.label);
}
function addSurfaces() {
  const roll = Math.random(), n = roll < 0.25 ? 0 : roll < 0.6 ? 1 : roll < 0.85 ? 2 : 3;
  const segs = L.straights.filter(s => !(s.slab && s.slab.crumble) && s.a.x < s.b.x && Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y) >= 150 && Math.abs(s.b.y - s.a.y) / (s.b.x - s.a.x) < 0.6).sort(() => Math.random() - 0.5);
  let placed = 0;
  for (const s of segs) {
    if (placed >= n) break;
    const len = Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y), d = { x: (s.b.x - s.a.x) / len, y: (s.b.y - s.a.y) / len };
    const patchLen = Math.min(len - 40, rand(110, 190)), s0 = rand(20, len - patchLen - 20);
    const a = { x: s.a.x + d.x * s0, y: s.a.y + d.y * s0 }, b = { x: a.x + d.x * patchLen, y: a.y + d.y * patchLen };
    // keep clear of the start positions so a round never begins on a patch
    if (['blue', 'red'].some(id => [a, b, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }].some(q => Math.hypot(q.x - L.spawn[id].P.x, q.y - L.spawn[id].P.y) < 170))) continue;
    addPatch(a, b, pick(['ice', 'mud']));
    placed++;
  }
}

function buildLevel(only) {              // only: rebuild this level type (used when a car would have started inside the ground)
  for (let attempt = 0; attempt < 15; attempt++) {
    const choices = LEVELS.filter(l => l.id !== lastLevelId);                 // never the same level type twice in a row
    const def = only ? LEVELS.find(l => l.id === only) : forceLevelId ? LEVELS.find(l => l.id === forceLevelId) : pick(choices);
    Composite.clear(engine.world, false);
    L = newLevel(def);
    if (Math.random() < (def.floor || 0)) addFloor(def.floorKind);      // decorations first, so later placement keeps clear of them
    if (Math.random() < (def.walls || 0)) addWalls();
    if (def.build()) {
      if (Math.random() < (def.movers || 0)) addMovers();
      if (Math.random() < (def.crumble || 0)) addCrumbling();
      if (!def.bare) addSurfaces();
      lastLevelId = def.id; return;
    }
  }
  // Last resort: the simplest level, which cannot fail.
  Composite.clear(engine.world, false);
  L = newLevel(LEVELS[0]);
  LEVELS[0].build(); lastLevelId = 'bowl';
}

/* ---------- car construction ---------- */
// Options: scale (wheel size), headScale, carScale (the whole car: teensy cars), square (square wheels), trailer ('caravan' or 'bomb').
function buildCar(id, P0, ang, o = {}) {
  if (o.threeWheel) return buildCar3(id, P0, ang);
  const { scale = 1, headScale = 1, carScale: K = 1, square = false, trailer = null } = o;
  const def = CARS[id], d = def.dir;
  const filter = { group: def.group };           // parts of one car, and anything it tows, never collide with each other
  const k = v => v * K;                          // design units -> world units

  const chassis = Bodies.rectangle(0, 0, k(104), k(20), { friction: 0.2, density: 0.0025, label: 'chassis' });
  // A giant head sits on the same seat (its bottom stays where a normal head's did) and weighs only twice as much,
  // so it is bigger and easier to bump but does not make the car hopelessly top-heavy.
  const headR = HEAD_R * headScale, headY = -10 - headR;                   // design units
  const head = Bodies.circle(0, k(headY), k(headR), { friction: 0.1, density: 0.0008 * (headScale > 1 ? 2 / (headScale * headScale) : 1), label: 'head' });
  head.isHead = true; head.owner = id;
  // Bonnet and boot rise above the wheel tops, so an upside-down car rests on them rather than on its wheels.
  const bonnet = Bodies.rectangle(k(46 * d), k(-3), k(32), k(26), { friction: 0.2, density: 0.0015, label: 'bonnet' });
  const boot = Bodies.rectangle(k(-46 * d), k(-3), k(32), k(26), { friction: 0.2, density: 0.0015, label: 'boot' });
  for (const part of [chassis, head, bonnet, boot]) part.collisionFilter = filter;

  const body = Body.create({ parts: [chassis, head, bonnet, boot], collisionFilter: filter });
  // Compound body's origin is its centre of gravity; remember where the design centre sits relative to it.
  const off = { x: -body.position.x, y: -body.position.y };

  // A square wheel's side is 0.88 of a round wheel's diameter/2 either way, but its corners reach further than its sides.
  const Rd = WHEEL_R * scale, half = square ? 0.88 * Rd : Rd, reach = square ? half * Math.SQRT2 : Rd;
  const WX = o.tall ? 62 : 44;                                    // tall suspension: a longer wheelbase, and the wheels hang well below the body on struts
  const wy = o.tall ? Rd + 16 : Math.max(WHEEL_Y, reach - 8);     // wheel tops stay below the bonnet however big or square the wheels are
  const cs = Math.cos(ang), sn = Math.sin(ang);
  const lift = k(wy + half) - (WHEEL_R + WHEEL_Y);               // the spawn height was worked out for standard wheels on a standard car
  const P = { x: P0.x + sn * lift, y: P0.y - cs * lift };

  // spawn lying along the terrain
  Body.setAngle(body, ang);
  Body.setPosition(body, { x: P.x - (cs * off.x - sn * off.y), y: P.y - (sn * off.x + cs * off.y) });

  const wheels = [], axles = [];
  for (const wx of [WX * d, -WX * d]) {
    const pos = { x: P.x + cs * k(wx) - sn * k(wy), y: P.y + sn * k(wx) + cs * k(wy) };
    const props = {
      // Matter uses the larger static friction of the two bodies, so the wheels' own value must be tiny or ice could never
      // be slippery; normal terrain still supplies its own 10, so grip on ordinary ground is unchanged.
      friction: 2.5, frictionStatic: 0.004, restitution: 0.05, density: 0.004 / (scale * scale), frictionAir: 0.004,   // same mass whatever the size
      collisionFilter: filter, label: 'wheel'

    banner = { title: `${CARS[winner].name} wins!`, sub: why, color: '#fff', tag: '' };
    document.getElementById(winner === 'blue' ? 'sBlue' : 'sRed').textContent = scores[winner];
    if (scores[winner] >= MATCH_POINTS) { matchWinner = winner; banner.sub = (why ? why + '. ' : '') + `${CARS[winner].name} wins the match!`; }

const overPhase = now => !overInfo || now < overInfo.fadeStart ? 'after' : 'fade';

// Bouncy tyres: Matter's own restitution is soaked up by the axles, so when a wheel lands on the terrain the whole
// car's velocity into the surface is reflected, scaled by TUNE.tireBounce. Landings also kick up dust, shake the
// screen and make the passenger grimace.
function onLanding(pair) {
  const a = pair.bodyA, b = pair.bodyB;
  const ground = a.label === 'terrain' ? a : b.label === 'terrain' ? b : null;
  const wheel = ground === a ? b : a;
  if (!ground || wheel.label !== 'wheel') return;
  const car = Object.values(cars).find(c => c.wheels.includes(wheel));
  if (!car) return;
  let nx = pair.collision.normal.x, ny = pair.collision.normal.y;
  const hit = (pair.collision.supports && pair.collision.supports[0]) || ground.position;
  if (nx * (wheel.position.x - hit.x) + ny * (wheel.position.y - hit.y) < 0) { nx = -nx; ny = -ny; }
  const bodies = [...car.bodies, ...car.wheels];
  // Inside a collision event `.velocity` still holds the raw per-step value (half of what setVelocity expects), so read
  // velocities with getVelocity, which always returns px per 16.7 ms: the same units setVelocity takes.
  const vel = new Map(bodies.map(bd => [bd, Body.getVelocity(bd)]));
  const into = bd => vel.get(bd).x * nx + vel.get(bd).y * ny;      // negative when moving into the ground
  const impact = Math.max(...bodies.map(bd => -into(bd)));         // speed into the ground
  const surface = ground.surface || 'normal';
  if (impact > lastImpact) lastImpact = impact;
  sfx.landing(impact, hit.x);
  if (impact > 6.5 && (car.airTime || 0) > 150) breakTrailer(car);   // coming down from a real jump or drop (not a wheelie slap) snaps a caravan off
  for (const bd of bodies) {                                       // reflect the speed into the ground, keep the speed along it
    const into_ = into(bd);

  if (impact > 5) spawnDust(hit.x, hit.y, Math.min(26, Math.round(5 + impact * 1.3)), surface, { speed: [40, 120 + impact * 10] });
  if (impact > 8) shake = Math.min(18, shake + (impact - 8) * 1.2);

const softProp = b => b.label === 'prop' && b.propKind !== 'rock';      // a ball bonking a head is harmless; a falling rock is not
Events.on(engine, 'collisionStart', e => {
  for (const pair of e.pairs) {
    onLanding(pair);
    onTrailerHit(pair);
    if (pair.bodyA.isHead && !softProp(pair.bodyB)) headHit(pair.bodyA.owner);
    if (pair.bodyB.isHead && !softProp(pair.bodyA)) headHit(pair.bodyB.owner);

// Which cars (and which wheels, on what ground) were touching the terrain on the previous step.
function scanContacts() {
  const touching = new Set(), wheelGround = new Map(), crumbleHits = new Set();
  for (const pair of engine.pairs.list) {
    if (!pair.isActive) continue;
    const a = pair.bodyA, b = pair.bodyB;
    if (a.label !== 'terrain' && b.label !== 'terrain') continue;
    const g = a.label === 'terrain' ? a : b, other = g === a ? b : a;
    for (const id in cars) {
      const c = cars[id];
      if (c.bodies.includes(other.parent)) touching.add(id);
      else if (c.wheels.includes(other)) { touching.add(id); wheelGround.set(other, g); }
      else continue;
      if (g.slab) crumbleHits.add(g.slab);

function startSuddenDeath() {
  sd = { kind: pick(['water', 'walls']), start: clock, inset: 12, bannerUntil: clock + 2800, bodies: [] };
  sfx.siren();

    for (const x of [-32, W + 32]) {

Events.on(engine, 'beforeUpdate', () => {

    for (const id in cars) for (const b of [...cars[id].bodies, ...cars[id].wheels]) Body.applyForce(b, b.position, { x: b.mass * gust, y: 0 });
  }

      meteorNext = clock + rand(450, 900);
      if (L.props.filter(p => !p.gone).length < 16) { const p = addBall(rand(60, W - 60), -40, rand(13, 24), 'rock', { life: 7000 }); Body.setVelocity(p.body, { x: rand(-1.5, 1.5), y: 4 }); }
    }
    if (roundMod.id === 'drunk' && drunk && clock >= drunk.next) {   // the controls swap over at random
      drunk.flipped = !drunk.flipped; drunk.next = clock + rand(2500, 5000); shake = Math.max(shake, 9); sfx.bump(W / 2);
    }
    if (roundMod.id === 'rocket') for (const id in cars) cars[id].boostUntil = 1e15;
  }

  }

    if (!cr) continue;

function checkRules() {
  if (state !== 'playing') return;
  for (const id in cars) {
    const c = cars[id], p = centreOf(c);
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) lose(id, 'out');
    if (c.head.position.y + c.headR > waterY) lose(id, 'water');
  }
  resolveRound();
}

/* ---------- occasional extras: crumbling slabs, moving platforms, power-ups ---------- */
// Crumbling slabs: stepped on, they shake for 0.8 s, then drop away.
function addCrumbling() {
  const slabs = L.items.filter(it => it.type === 'slab' && !nearSpawn(it.cx, it.cy, it.len / 2 + 120)).sort(() => Math.random() - 0.5);
  let n = 0;
  for (const s of slabs) { if (n >= randInt(1, 2)) break; s.crumble = { state: 'solid' }; n++; }
  if (n) L.extras.push('crumbling slab');
}
// Moving platforms: a slab that slides or bobs along a straight path. Like the rotors it is a heavy body that is
// placed and given its velocity every step, so it carries cars along with it.
function placeMover(m, time) {
  const sn = Math.sin(m.w * time + m.phase), v = Math.cos(m.w * time + m.phase) * m.w;
  Body.setPosition(m.body, { x: m.base.x + m.ax * sn, y: m.base.y + m.ay * sn });
  Body.setVelocity(m.body, { x: m.ax * v / 60, y: m.ay * v / 60 });
}
function addMovers() {
  const want = randInt(1, 2);
  let n = 0;
  for (let i = 0; i < 200 && n < want; i++) {
    const len = rand(150, 210), horiz = Math.random() < 0.6, amp = horiz ? rand(90, 160) : rand(60, 110), c = { x: rand(250, 1030), y: rand(200, 480) };
    const ax = horiz ? amp : 0, ay = horiz ? 0 : amp;
    const swept = [-1, -0.5, 0, 0.5, 1].flatMap(t => slabPts(c.x + ax * t, c.y + ay * t, len, 0));      // everywhere the platform will be
    if (swept.some(p => p.x < 40 || p.x > W - 40 || p.y < 100 || p.y > WATER_Y - 80 || nearSpawn(p.x, p.y, 100) || !freeAir(p.x, p.y))) continue;
    if (!clearOf(swept, 85)) continue;
    if (L.rotors.some(r => swept.some(p => Math.hypot(p.x - r.pos.x, p.y - r.pos.y) < r.len / 2 + 60))) continue;
    if (L.movers.some(m => Math.hypot(m.base.x - c.x, m.base.y - c.y) < 260)) continue;
    const body = Bodies.rectangle(c.x, c.y, len, 16, { ...TERRAIN_PROPS });
    Body.setMass(body, 1e6); Body.setInertia(body, Infinity);
    Composite.add(engine.world, body);
    const m = { body, base: c, ax, ay, w: rand(0.5, 0.9), phase: rand(0, 6.28), len };
    L.movers.push(m); L.items.push({ type: 'mover', m });
    placeMover(m, 0);
    n++;
  }
  if (n) L.extras.push('moving platform');
}
// Power-ups: a few floating orbs, boost (a burst of speed, then 2.5 s of extra power and top speed) or shield
// (absorbs the next head bump). Taken ones do not come back that round.
function addPickups() {
  const want = randInt(2, 4), spots = [];
  for (let i = 0; i < 300 && spots.length < want; i++) {
    const q = pick(L.samples), x = q.x, y = q.y - 70;
    if (x < 90 || x > W - 90 || y < 90 || y > WATER_Y - 60) continue;
    if (!freeAir(x, y) || L.samples.some(sm => Math.hypot(sm.x - x, sm.y - y) < 48)) continue;
    if (nearSpawn(x, y, 170) || spots.some(sp => Math.hypot(sp.x - x, sp.y - y) < 200)) continue;
    if (L.rotors.some(r => Math.hypot(r.pos.x - x, r.pos.y - y) < r.len / 2 + 40)) continue;
    spots.push({ x, y, kind: pick(['boost', 'shield']), taken: false });
  }
  if (spots.length) { L.pickups = spots; L.extras.push('power-ups'); }
}
function collectPickups() {
  for (const p of L.pickups) {
    if (p.taken) continue;
    for (const id in cars) {
      const c = cars[id];
      if (Math.hypot(centreOf(c).x - p.x, centreOf(c).y - p.y) > (c.body2 ? 110 : 72) * c.carScale && Math.hypot(c.head.position.x - p.x, c.head.position.y - p.y) > 44 * c.carScale) continue;
      p.taken = true;
      sfx.chime(p.kind, p.x);
      if (p.kind === 'boost') {
        c.boostUntil = clock + 2500;
        const a = c.body.angle, fx = Math.cos(a) * c.facing, fy = Math.sin(a) * c.facing;       // along the car's nose
        for (const bd of [...c.bodies, ...c.wheels]) { const v = Body.getVelocity(bd); Body.setVelocity(bd, { x: v.x + fx * 6, y: v.y + fy * 6 }); }
        spawnDust(p.x, p.y, 14, 'gold', { speed: [80, 260], size: [4, 9] });
      } else {
        c.shield = true;
        spawnDust(p.x, p.y, 14, 'shield', { speed: [60, 200], size: [4, 9] });
      }
      shake = Math.min(18, shake + 3);

    }
  }
}
function emitFlames(c) {                       // boost: a jet of flame out of the back
  const a = c.body.angle, rx = -Math.cos(a) * c.facing, ry = -Math.sin(a) * c.facing;
  for (let i = 0; i < 3; i++) {
    const sp = rand(120, 380), life = rand(0.18, 0.4), j = rand(-0.35, 0.35), cj = Math.cos(j), sj = Math.sin(j);
    particles.push({ type: 'spark', x: c.body.position.x + rx * 64, y: c.body.position.y + ry * 64 + 6, vx: (rx * cj - ry * sj) * sp, vy: (rx * sj + ry * cj) * sp, life, max: life, color: pick(['#fff1a8', '#ffd23f', '#ff9f1c', '#ff6b1c']) });
  }
}
function emitWeather() {
  if (wind) for (let i = 0; i < 3; i++) {
    const life = rand(0.5, 1.1);
    particles.push({ type: 'gust', x: rand(-50, W + 50), y: rand(40, WATER_Y), vx: wind.dir * rand(650, 950), vy: 0, len: rand(50, 110), life, max: life });
  }
  if (roundMod && roundMod.id === 'storm') for (let i = 0; i < 9; i++) {
    const life = rand(0.6, 0.9);

// A head hit normally ends the round, but a shield absorbs one (with a 1.2 s grace period afterwards).
function headHit(id) {
  const c = cars[id];

  if (c.shield) {
    c.shield = false; c.invulnUntil = clock + 1200;
    sfx.pop(c.head.position.x);
    spawnDust(c.head.position.x, c.head.position.y, 16, 'shield', { speed: [60, 200], size: [4, 8] });

/* ---------- towing: caravans that snap off, and bomb trailers ---------- */
const BOMB_FUSE = 3000, BOMB_RADIUS = 240, BOMB_KILL = 100;       // fuse in ms; blast radius and head-kill radius in px
function breakTrailer(c) {                     // the caravan's tow bar snaps and the caravan blows up
  const T = c.trailer;
  if (!T || T.kind !== 'caravan' || !T.attached) return;
  const at = Constraint.pointAWorld(T.hitch), cx = T.body.position.x, cy = T.body.position.y;
  Composite.remove(engine.world, T.hitch);
  T.attached = false;
  sfx.snap(at.x);
  particles.push({ type: 'text', x: at.x, y: at.y - 20, vx: 0, vy: -70, text: 'SNAP!', color: '#ffd23f', life: 1, max: 1 });
  spawnDust(at.x, at.y, 12, 'gold', { speed: [60, 220], size: [3, 7] });
  Composite.remove(engine.world, [T.body, ...T.wheels, ...T.cons]);       // the caravan is blown to bits
  T.gone = true;
  sfx.boom(cx);
  blastAt(cx, cy, 190, 60, 0.7, 12);
}
function onTrailerHit(pair) {                  // a caravan that takes a hard knock breaks off
  const a = pair.bodyA, b = pair.bodyB;
  for (const x of [a, b]) {
    const c = x.trailerOf && cars[x.trailerOf];
    if (!c || !c.trailer || c.trailer.kind !== 'caravan' || !c.trailer.attached) continue;
    const o = x === a ? b : a, va = Body.getVelocity(x.parent), vb = Body.getVelocity(o.parent), n = pair.collision.normal;
    if (Math.abs((va.x - vb.x) * n.x + (va.y - vb.y) * n.y) > 6.5) breakTrailer(c);
  }
}
// A bomb that bounces out of its trailer is lit; three seconds later it explodes.
function updateBombs(now) {
  for (const id in cars) {
    const T = cars[id].trailer;
    if (!T || T.kind !== 'bomb' || T.exploded) continue;
    if (T.lit === null) {
      const tb = T.body, dx = T.bomb.position.x - tb.position.x, dy = T.bomb.position.y - tb.position.y, c = Math.cos(-tb.angle), sn = Math.sin(-tb.angle);
      const lx = dx * c - dy * sn, ly = dx * sn + dy * c;                      // the bomb's position in the trailer's own frame
      if (Math.abs(lx) > 62 || ly < -34 || ly > 45) { T.lit = now; T.lastTick = 4; sfx.fuse(T.bomb.position.x); }   // out of the flatbed: lit
    } else {

/* ---------- the computer player ---------- */
// It works the same controls as a person: each "thought" it picks -1, 0 or +1 (anti-clockwise, nothing, clockwise), just like holding a key.

const AI_LEVELS = {
  easy:   { think: 380, duty: 0.55, mistake: 0.12, pickups: false },
  medium: { think: 200, duty: 0.8, mistake: 0.04, pickups: true },
  hard:   { think: 90, duty: 1, mistake: 0, pickups: true }

let aiIds = new Set(), aiLevel = 'medium';
let menuOn = true, matchWinner = null;       // the start menu is showing; and who has won the match (first to MATCH_POINTS)
const MATCH_POINTS = 5;
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
// Is there safe ground ahead of a car, in the given screen direction? (not a cliff, and not a pit down at the water)
function groundAhead(c, sd) {
  const cm = centreOf(c), x = cm.x + sd * (90 + Math.abs(c.body.velocity.x) * 8);

  if (hits.length > 0 && Math.min(...hits.map(b => b.bounds.min.y)) < waterY - 45) return true;

}
function setMode(m) {                                                          // 'two', 'ai-easy', 'ai-medium' or 'ai-hard'
  const ai = m.startsWith('ai-');

  if (ai) aiLevel = m.slice(3);
  const red = document.getElementById('redName'), help = document.getElementById('helpRed');
  if (red) red.textContent = ai ? 'Red (computer)' : 'Red';
  if (help) help.innerHTML = ai ? '<span style="color:#ff5a5a">Red</span>: the computer' : '<span style="color:#ff5a5a">Red</span>: <b>,</b> anti-clockwise, <b>.</b> clockwise';

/* ---------- input ---------- */
const GAME_KEYS = new Set(['KeyZ', 'KeyX', 'Comma', 'Period', 'KeyC', 'Slash']);

/* ---------- camera ---------- */
// The view is a 16:9 window onto the 1280x720 world. It never shows more than the whole world.
const CAM = { zoomMax: 2.4, targetMargin: 170, hardMargin: 70, zoomInRate: 0.5, zoomOutRate: 6, panRate: 3 };
const cam = { x: W / 2, y: H / 2, z: 1 };
function resetCamera() { cam.x = W / 2; cam.y = H / 2; cam.z = 1; }
function carBounds() {

/* ---------- motion effects: dust, skid marks and speed lines ---------- */
function emitMotionFx() {
  for (const id in cars) {
    const c = cars[id], v = c.body.velocity, speed = Math.hypot(v.x, v.y);
    if (speed > 10.5) {                                  // speed lines: streaks left hanging in the air behind a fast car
      const ux = v.x / speed, uy = v.y / speed;
      for (let i = speed > 13 ? 2 : 1; i > 0; i--) {
        const off = rand(-45, 45), life = rand(0.18, 0.3);
        particles.push({ type: 'streak', x: c.body.position.x - uy * off, y: c.body.position.y + ux * off, dx: ux, dy: uy, len: 40 + (speed - 10.5) * 12, life, max: life });
      }
    }
    const a = c.body.angle, fwd = { x: Math.cos(a), y: Math.sin(a) }, down = { x: -Math.sin(a), y: Math.cos(a) };
    const vf = v.x * fwd.x + v.y * fwd.y;                // speed along the car
    for (const w of c.wheels) {
      const g = touchInfo.wheelGround.get(w);
      if (!g) { w._markPos = null; continue; }
      const surface = g.surface || 'normal';
      const slip = Math.abs(w.angularVelocity * c.wheelR - vf);     // wheel surface speed against ground speed: spinning or sliding
      const cp = { x: w.position.x + down.x * c.wheelR, y: w.position.y + down.y * c.wheelR };
      // Under full throttle the wheels spin faster than the car moves (slip of 8-10), so skid marks need a clearly bigger slip
      if (slip > 5) {                                    // tyres biting, spinning or sliding: dust
        if (slip > 9 && w._markPos && Math.hypot(cp.x - w._markPos.x, cp.y - w._markPos.y) < 40)
          addMark(w._markPos.x, w._markPos.y, cp.x, cp.y, surface === 'ice' ? '255,255,255' : surface === 'mud' ? '40,24,12' : '25,20,15');
        w._markPos = slip > 9 ? cp : null;
        spawnDust(cp.x, cp.y, slip > 14 ? 2 : 1, surface, { spread: 0.7, speed: [20, 90], size: [4, 9] });
      } else {
        w._markPos = null;
        if (speed > 7 && Math.random() < 0.3) spawnDust(cp.x, cp.y, 1, surface, { spread: 0.6, speed: [10, 60], size: [4, 8] });
        else if (surface === 'mud' && speed > 2 && Math.random() < 0.5) spawnDust(cp.x, cp.y, 1, 'mud', { spread: 0.8, speed: [30, 100], size: [3, 7] });
      }
    }
  }
}

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
function frame(now, manual) {
  if (testMode && !manual) return;
  clock = now;
  const dt = Math.min(now - last, 50); last = now;
  if (menuOn) {                                   // the start menu: the game stands still behind it
    sfx.engines(cars, 'ready'); updateCamera(dt / 1000); draw(now);
    if (!manual) requestAnimationFrame(frame);
    return;
  }

  // slow motion eases back to normal speed over the last half of its duration
  timeScale = 1;
  if (slow) {
    const k = (now - slow.start) / slow.ms;
    if (k >= 1) slow = null; else timeScale = 0.2 + 0.8 * Math.pow(Math.max(0, (k - 0.5) / 0.5), 2);
  }

  const phase = state === 'over' ? overPhase(now) : null;
  if (state === 'playing') aiUpdate(now);
  if (state === 'ready') {
    if (now >= readyUntil) { state = 'playing'; roundStart = now; sfx.go(); }
  } else {
    acc += dt * timeScale;
    while (acc >= STEP) { Engine.update(engine, STEP); acc -= STEP; checkRules(); }
  }
  if (state === 'playing' && !sd && now - roundStart > SUDDEN.afterMs) startSuddenDeath();
  if (state === 'playing') collectPickups();
  if (state === 'over') {
    if (phase === 'fade' && pendingWinner && !celebrate) { celebrate = { id: pendingWinner, start: now }; sfx.win(); }
    if (now >= overInfo.endAt) { if (matchWinner) endMatch(); else newRound(); }
  }

  if (state !== 'ready') {
    for (const id in cars) {                      // a bumped head keeps showering sparks for a while
      const c = cars[id];
      if (c.sparkUntil && now < c.sparkUntil) {
        for (let i = 0; i < 2; i++) {
          const a = Math.random() * Math.PI * 2, sp = rand(60, 300), life = rand(0.5, 1.1);
          particles.push({ type: 'spark', x: c.head.position.x, y: c.head.position.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life, max: life, color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0] });
        }
      }
      if (now < (c.boostUntil || 0)) emitFlames(c);
    }
    emitMotionFx();
    emitWeather();
    updateBombs(now);
  }
  sfx.engines(cars, state); sfx.ambient(roundMod && roundMod.id, now); sfx.muffle(timeScale);
  if (state !== 'ready') for (const id in cars) {                // a splash as a car goes into the water
    const c = cars[id], wet = c.body.position.y > waterY;
    if (wet && !c.wasWet) sfx.splash(c.body.position.x);
    c.wasWet = wet;
  }
  for (const id in cars) cars[id].flipX = cars[id].facing;      // turning round is instant: the car simply swaps to face the other way
  updateParticles(dt * timeScale / 1000);
  shake *= Math.exp(-7 * dt / 1000);
  updateCamera(dt / 1000);
  draw(now);
  if (!manual) requestAnimationFrame(frame);
}

/* ---------- tune-up panel ---------- */
const TUNE_DEFAULTS = { ...TUNE };
const SLIDERS = [
  ['tMaxSpin', 'oMaxSpin', 'maxSpin', v => v.toFixed(2)],
  ['tSusp', 'oSusp', 'suspension', v => v.toFixed(2)]

const TUNE_KEYS = SLIDERS.map(sl => sl[2]);
// Saved settings carry a units version. Before version 2 the tyre bounce was applied at half strength (a units bug),
// so an older saved tyre-bounce value is halved on load to keep the car bouncing exactly as it did when it was tuned.
const TUNE_UNITS = 2;
const tuneSnapshot = () => ({ ...Object.fromEntries(TUNE_KEYS.map(k => [k, TUNE[k]])), units: TUNE_UNITS });
function applyTune(t) {
  if (!t) return;
  const old = t.units !== TUNE_UNITS;
  for (const k of TUNE_KEYS) if (typeof t[k] === 'number' && isFinite(t[k])) TUNE[k] = old && k === 'tireBounce' ? Math.min(1.2, t[k] * 0.5) : t[k];
}
function saveTune() {                                                      // each player's sliders are kept in their own browser
  try { localStorage.setItem('carGameTune', JSON.stringify(tuneSnapshot())); } catch (e) { }
}
function syncTuneUi() {
  for (const [sid, oid, key, fmt] of SLIDERS) {
    document.getElementById(sid).value = TUNE[key];
    document.getElementById(oid).textContent = fmt(TUNE[key]);
  }
  applyGravity();
}
try { applyTune(JSON.parse(localStorage.getItem('carGameTune') || '{}')); } catch (e) { }
for (const [sid, oid, key, fmt] of SLIDERS) {
  document.getElementById(sid).addEventListener('input', e => {
    TUNE[key] = parseFloat(e.target.value);
    document.getElementById(oid).textContent = fmt(TUNE[key]);
    applyGravity();
    saveTune();
  });
}
for (const b of document.querySelectorAll('#menuBtns button')) b.addEventListener('click', () => { sfx.ensure(); startMatch(b.dataset.mode); });
document.getElementById('tReset').addEventListener('click', () => { Object.assign(TUNE, TUNE_DEFAULTS); syncTuneUi(); saveTune(); });
// ---- sound controls
const muteBtn = document.getElementById('tMute'), volSlider = document.getElementById('tVolume'), volOut = document.getElementById('oVolume');
function syncSoundUi() { muteBtn.textContent = sfx.muted ? 'Sound off' : 'Sound on'; volSlider.value = sfx.volume; volOut.textContent = Math.round(sfx.volume * 100) + '%'; }
function toggleMute() { sfx.ensure(); sfx.setMuted(!sfx.muted); syncSoundUi(); }
muteBtn.addEventListener('click', toggleMute);
volSlider.addEventListener('input', e => { sfx.ensure(); sfx.setVolume(parseFloat(e.target.value)); syncSoundUi(); });
addEventListener('keydown', e => { sfx.ensure(); if (e.code === 'KeyM' && !e.repeat && e.target.tagName !== 'INPUT') toggleMute(); });   // any key press unlocks audio; M mutes
addEventListener('pointerdown', () => sfx.ensure());
syncSoundUi();
const nextSel = document.getElementById('nextLevel');
for (const l of LEVELS) nextSel.add(new Option(l.name, l.id));
nextSel.addEventListener('change', () => { forceLevelId = nextSel.value || null; nextSel.blur(); });
syncTuneUi();

window.__game = {
  get L() { return L; }, LEVELS, setForce(id) { forceLevelId = id; }, TUNE, SUDDEN, END, cam, CAM, updateCamera, engine, newRound, checkRules, frame,
  start() { state = 'playing'; roundStart = clock; }, manual(on) { testMode = on; },
  setPickupNext() { nextPickupRound = roundNo + 1; }, setClock(t) { clock = t; last = t; },
  get cars() { return cars; }, get state() { return state; }, get sd() { return sd; }, get waterY() { return waterY; }, get slow() { return slow; },
  get overInfo() { return overInfo; }, get roundMod() { return roundMod; }, get wind() { return wind; },
  respawn(id, P, ang) { removeCar(cars[id]); cars[id] = buildCar(id, P, ang); },
  drawFace, ctx,
  startMatch, showMenu, endMatch, get menuOn() { return menuOn; }, get bird() { return bird; }, HAMMER, get matchWinner() { return matchWinner; }, hideMenu() { menuOn = false; document.getElementById('menu').classList.add('hidden'); },
  forceMod(id) { forceModId = id; }, sfx, BEND, setMode, setAI(ids, level) { aiIds = new Set(ids); aiLevel = level; }, get aiIds() { return aiIds; },
  dbg: { buildLevel, buildCar, carsOverlapTerrain, removeCars() { for (const id in cars) removeCar(cars[id]); } },
  get rebuilds() { return rebuilds; }, get lastImpact() { return lastImpact; }, resetImpact() { lastImpact = 0; }, get particles() { return particles; }, get marks() { return marks; }, get shake() { return shake; }, get celebrate() { return celebrate; }, get fadeIn() { return fadeIn; },
  scores, keys
};
newRound();
requestAnimationFrame(frame);
</script>
</body>
</html>
